<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/jpeg" href="https://s3-ap-southeast-1.amazonaws.com/vestdata/images/DistributorProfileImage/noimage.jpg" />
    <title>Vestige Chat</title>
    <script>
      // Apply the remembered theme before the first paint (no white flash in dark mode).
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem('temu:appearance') || '{}');
          var dark = a.theme === 'dark' || ((!a.theme || a.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.accent = a.accent || 'indigo';
          root.dataset.font = a.fontSize || 'medium';
          root.dataset.bubble = a.bubbleStyle || 'rounded';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
